name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck -w @lesson-loop/api
      - run: npm run typecheck -w @lesson-loop/shared
      - run: NODE_OPTIONS="--max-old-space-size=4096" npm run typecheck -w @lesson-loop/web
      - run: npm run test --workspaces --if-present

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
