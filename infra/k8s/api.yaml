apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson-loop-api
  namespace: lesson-loop
  labels:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lesson-loop
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lesson-loop
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: lesson-loop-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lesson-loop-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lesson-loop-api
  namespace: lesson-loop
  labels:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lesson-loop-api
  namespace: lesson-loop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lesson-loop-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
