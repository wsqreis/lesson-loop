apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson-loop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lesson-loop-api
  template:
    metadata:
      labels:
        app: lesson-loop-api
    spec:
      containers:
        - name: api
          image: lesson-loop-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: lesson-loop-config
                  key: databaseUrl
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lesson-loop-api
spec:
  selector:
    app: lesson-loop-api
  ports:
    - port: 3001
      targetPort: 3001
