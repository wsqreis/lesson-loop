apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson-loop-web
  namespace: lesson-loop
  labels:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lesson-loop
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lesson-loop
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: lesson-loop-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NUXT_PUBLIC_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: lesson-loop-config
                  key: apiBase
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lesson-loop-web
  namespace: lesson-loop
  labels:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: lesson-loop
    app.kubernetes.io/component: web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lesson-loop-web
  namespace: lesson-loop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lesson-loop-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
